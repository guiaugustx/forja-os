# Infra local de desenvolvimento — Postgres + Redis.
# Em produção, o Coolify provisiona esses serviços; aqui é só para rodar na sua máquina.
services:
  postgres:
    image: postgres:16-alpine
    container_name: forja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forja
      POSTGRES_PASSWORD: forja
      POSTGRES_DB: forja
    ports:
      - "5432:5432"
    volumes:
      - forja_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forja"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: forja_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - forja_redisdata:/data

volumes:
  forja_pgdata:
  forja_redisdata:
